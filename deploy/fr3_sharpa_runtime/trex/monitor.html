<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>T-Rex 实时观测</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#e6edf3;font:15px system-ui,sans-serif;padding:24px}
header{display:flex;gap:20px;align-items:center;justify-content:space-between}h1{font-size:24px;margin:0}h2{font-size:18px;margin:24px 0 12px}
.muted{color:#a5b5c4;font-size:13px}#status{padding:10px 16px;background:#263846;border-radius:8px}
.grid{display:grid;gap:12px}.cameras{grid-template-columns:repeat(3,minmax(0,1fr))}.fingers{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:#1a2732;border:1px solid #334656;border-radius:10px;padding:12px;overflow:hidden}.card img{width:100%;object-fit:contain;display:block;background:#091016;aspect-ratio:4/3;border-radius:5px}.fingers img{aspect-ratio:1}
.label{font-weight:600;margin-bottom:8px}.age{font-size:12px;color:#75d9a6;min-height:32px;margin-top:8px}.stale{color:#ffb46b}.wrench{font:12px ui-monospace,monospace;white-space:pre-line;line-height:1.6}.offline{color:#ffb46b!important}#run{overflow-wrap:anywhere}
@media(max-width:900px){.cameras{grid-template-columns:1fr}.fingers{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:start;flex-direction:column}}
</style>
<header><h1>T-Rex 实时观测</h1><div id="status">等待执行器数据…</div></header>
<p class="muted">只读预览 · 4 Hz · 各路最新真实帧并列显示，非严格同步快照 · 超过 200 ms 标记过期 · 无运动控制按钮</p>
<div id="playback" hidden><button id="play">播放</button> <input id="seek" type="range" min="0" value="0" step="1" style="width:65%"> <span id="position"></span></div>
<p id="recording" class="muted"></p>
<div class="grid cameras" id="cameras"></div>
<h2>左手触觉</h2><div class="grid fingers" id="left"></div>
<h2>右手触觉</h2><div class="grid fingers" id="right"></div>
<p class="muted">F6 顺序：Fx / Fy / Fz / Tx / Ty / Tz，原始 SDK 数值；图像为原始形变灰度图。相机标记保留 cam 编号。</p>
<p id="run" class="muted"></p>
<script>
const refs={},names={thumb:'拇指',index:'食指',middle:'中指',ring:'无名指',pinky:'小指'};
let mode='live',frame=0,frames=0,playing=false;
document.getElementById('play').onclick=()=>{if(frame>=frames-1)frame=0;playing=!playing;document.getElementById('play').textContent=playing?'暂停':'播放'};
document.getElementById('seek').oninput=e=>{frame=Number(e.target.value);playing=false;document.getElementById('play').textContent='播放'};
function card(parent,key,label,finger){
 const node=document.createElement('div');node.className='card';
 node.innerHTML='<div class="label"></div><img alt="等待图像"><div class="age">等待数据</div>'+(finger?'<div class="wrench"></div>':'');
 node.querySelector('.label').textContent=label;document.getElementById(parent).append(node);refs[key]=node;
}
['cam0','cam1','cam2'].forEach(c=>card('cameras',c,c,false));
['left','right'].forEach(s=>Object.entries(names).forEach(([f,n])=>card(s,s+'/'+f,n,true)));
function update(key,data,elapsed){
 const node=refs[key],age=node.querySelector('.age');
 if(!data){age.textContent='等待数据';age.className='age stale';return}
 const ms=data.age_ms+elapsed,source=data.source_age_ms;
 const stale=ms>200||ms<0||(source!==undefined&&(source+elapsed>200||source+elapsed<0));
 age.className='age'+(stale?' stale':'');
 age.textContent=(stale?'过期 / 异常 · ':(mode==='replay'?'记录时 · ':'实时 · '))+ms.toFixed(0)+' ms'+(source!==undefined?' · 源 '+(source+elapsed).toFixed(0)+' ms':' · 帧 '+data.frame_id);
 if(data.error){age.textContent+=' · '+data.error;age.className='age stale'}
 if(data.image)node.querySelector('img').src=data.image;
 if(data.wrench)node.querySelector('.wrench').textContent='F '+data.wrench.slice(0,3).map(v=>v.toFixed(3)).join(' / ')+'\nT '+data.wrench.slice(3).map(v=>v.toFixed(3)).join(' / ');
}
async function poll(){
 const status=document.getElementById('status');
 try{
  const res=await fetch('/state'+(mode==='replay'?'?frame='+frame:''),{cache:'no-store',signal:AbortSignal.timeout(1500)});const data=await res.json();
  if(!data.generated_unix_ms)throw Error('等待预览初始化');
  const elapsed=mode==='replay'?0:Math.max(0,Date.now()-data.generated_unix_ms),p=data.progress||{};
  if(data.error)throw Error(data.error);
  status.className=elapsed>1000?'offline':'';
  status.textContent=elapsed>1000?'预览已停止更新':(mode==='replay'?'回放 · ':'')+(p.phase||'准备中')+' · 已完成 '+(p.completed_chunks??0)+' · 当前 '+(p.chunk_number??'—')+' / '+(p.total_chunks===0?'无限':p.total_chunks??'—');
  Object.keys(refs).forEach(k=>update(k,(data.cameras||{})[k]||(data.fingers||{})[k],elapsed));
  document.getElementById('run').textContent=data.run_directory||'';
  const rec=data.recording||{};document.getElementById('recording').textContent=mode==='replay'?'历史观测回放 · 约 4 Hz，非原始全帧录像':rec.enabled?(rec.error?'录制已停止：'+rec.error:'正在保存观测回放 · '+rec.frames+' 帧'):'';
  if(mode==='replay'){
   document.getElementById('seek').value=frame;
   document.getElementById('position').textContent=(frame+1)+' / '+frames+' 帧 · '+data.replay.elapsed_s.toFixed(1)+' s';
   if(playing){if(frame<frames-1)frame++;else{playing=false;document.getElementById('play').textContent='播放'}}
  }
 }catch(error){status.textContent='未连接 / 执行器已退出 · '+error.message;status.className='offline';document.querySelectorAll('.age').forEach(a=>{a.textContent='无实时更新';a.className='age stale'})}
 setTimeout(poll,250);
}
async function init(){
 try{const meta=await(await fetch('/meta')).json();mode=meta.mode;
  if(mode==='replay'){frames=meta.frames;document.getElementById('playback').hidden=false;document.getElementById('seek').max=frames-1;document.querySelector('h1').textContent='T-Rex 观测回放'}
 }catch(error){}
 poll();
}init();
</script></html>
