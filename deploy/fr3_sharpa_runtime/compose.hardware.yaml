# Extend the existing camera runtime without starting its bag recorder.
services:
  openpi-cameras:
    extends:
      file: ${SHARPA_GELLO_REPO:-/home/user/gello_upper_body_teleop}/docker/compose.yaml
      service: data-collection
    profiles: [openpi-hardware]
    environment:
      ORBBEC_SDK_LICENSE_ACCEPTED: ${ORBBEC_SDK_LICENSE_ACCEPTED:?Use the existing Orbbec license acceptance environment}
    command:
      - ros2
      - launch
      - teleop_camera_bringup
      - triple_camera.launch.py
      - deployment_config:=/workspace/franka_upper_body_teleop/data_collection/config/cameras.yaml
